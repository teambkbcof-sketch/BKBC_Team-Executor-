<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BKBC TEAM EXECUTOR</title>
    <style>
        body {
            background-color: #0c0c0c;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 900px;
            background: #151515;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
        }

        .title {
            color: #ff3333;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 1px;
        }

        textarea {
            width: 100%;
            height: 350px;
            background: #050505;
            color: #00ff66;
            border: 1px solid #333;
            padding: 15px;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            outline: none;
            resize: none;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .footer-btns {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn-attach { background: #ff3333; color: white; }
        .btn-execute { background: #252525; color: white; border: 1px solid #444; }
        button:hover { opacity: 0.8; }

        /* Status Box on the Right */
        #status-panel {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 200px;
            background: #111;
            border-right: 4px solid #ff3333;
            padding: 15px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.3);
            display: none;
        }

        .status-item {
            font-size: 12px;
            margin-bottom: 5px;
            color: #888;
        }

        .status-val {
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div id="status-panel">
        <div class="status-item">PROCESS:</div>
        <span id="st-process" class="status-val" style="color: #ff3333;">IDLE</span>
        
        <div class="status-item">CONNECTION:</div>
        <span id="st-conn" class="status-val">WAITING</span>

        <div class="status-item">LOG:</div>
        <span id="st-log" class="status-val" style="font-size: 10px; color: #00ff66;">READY</span>
    </div>

    <div class="container">
        <div class="header">
            <div class="title">BKBC TEAM EXECUTOR [v2.0]</div>
            <div style="font-size: 12px; color: #444;">ENGINE: CLOUD_SYNC</div>
        </div>

        <textarea id="editor" placeholder="-- Enter your script here..."></textarea>

        <div class="footer-btns">
            <button class="btn-attach" onclick="attach()">Attach</button>
            <button class="btn-execute" onclick="execute()">Execute</button>
        </div>
    </div>

    <script>
        const stPanel = document.getElementById('status-panel');
        const stProcess = document.getElementById('st-process');
        const stConn = document.getElementById('st-conn');
        const stLog = document.getElementById('st-log');

        function updateStatus(proc, conn, log, color = "#ff3333") {
            stPanel.style.display = "block";
            stProcess.innerText = proc.toUpperCase();
            stProcess.style.color = color;
            stConn.innerText = conn.toUpperCase();
            stLog.innerText = log.toUpperCase();
        }

        function attach() {
            updateStatus("Scanning", "Searching...", "Initializing", "gold");
            
            setTimeout(() => {
                // Simulating connection check
                fetch('http://127.0.0.1:5000/status').catch(() => {});
                
                updateStatus("Attached", "Connected", "Successfully Linked", "#00ff66");
            }, 1500);
        }

        function execute() {
            const code = document.getElementById('editor').value;
            if(!code) return alert("Editor is empty!");

            updateStatus("Executing", "Sending Data", "Transmitting Script", "cyan");

            setTimeout(() => {
                updateStatus("Finished", "Active", "Execution Successful", "#00ff66");
                console.log("BKBC: Script executed.");
            }, 1000);
        }
    </script>
</body>
</html>
